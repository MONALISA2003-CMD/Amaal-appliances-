name: Extract Amaal commerce ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'ZIP filename uploaded to the repository root'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Update Amaal commerce app'
        type: string

permissions:
  contents: write

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "${{ inputs.zip_name }}"

          unzip -t "${{ inputs.zip_name }}" >/dev/null

      - name: Extract new application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .amaal-extract
          mkdir .amaal-extract

          unzip -q "${{ inputs.zip_name }}" -d .amaal-extract

          shopt -s dotglob nullglob

          entries=(.amaal-extract/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/. .amaal-extract/
            rmdir "${entries[0]}" 2>/dev/null || true
          fi

      - name: Replace old application files
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.amaal-extract' \
            ! -name "${{ inputs.zip_name }}" \
            -exec rm -rf {} +

          cp -a .amaal-extract/. .

          rm -rf .amaal-extract

          rm -f "${{ inputs.zip_name }}"

      - name: Verify application structure
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -d app
          test -d components
          test -d data
          test -d lib
          test -d types

          test ! -f app/package.json
          test ! -f components/package.json

          echo "Amaal application structure verified."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "${{ inputs.commit_message }}"

          git push
