name: Amaal Commerce ZIP Extractor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amaal-zip-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and Install Amaal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository root for ZIP files..."

          mapfile -t zips < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in the repository root."
            echo "Upload the Amaal ZIP to the repository root, commit it, then run this workflow."
            exit 1
          fi

          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found."
            printf '%s\n' "${zips[@]}"
            echo "Keep only the ZIP you want to install."
            exit 1
          fi

          ZIP="${zips[0]}"

          echo "Using ZIP: $ZIP"

          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP"

          echo "ZIP integrity: PASS"

      - name: Extract to staging area
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          rm -rf .amaal-staging

          mkdir -p .amaal-staging

          echo "Extracting ZIP into staging area..."

          unzip -q "$ZIP" -d .amaal-staging

          echo "Extraction completed."

      - name: Normalize ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          shopt -s dotglob nullglob

          entries=(.amaal-staging/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            wrapper="${entries[0]}"

            echo "Single wrapper directory detected:"
            echo "$wrapper"

            mkdir -p .amaal-normalized

            cp -a "$wrapper"/. .amaal-normalized/

            rm -rf .amaal-staging

            mv .amaal-normalized .amaal-staging

            echo "ZIP wrapper normalized."
          else
            echo "No wrapper directory detected."
          fi

      - name: Validate Amaal application
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".amaal-staging"

          echo "Validating staged application..."

          required_files=(
            "package.json"
          )

          required_dirs=(
            "app"
            "components"
            "data"
            "lib"
            "types"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$ROOT/$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$ROOT/$dir" ]; then
              echo "::error::Required directory missing: $dir"
              exit 1
            fi
          done

          if find "$ROOT" \
            -mindepth 2 \
            -name package.json \
            -print \
            | grep -q .; then

            echo "::error::Nested package.json detected."

            find "$ROOT" \
              -mindepth 2 \
              -name package.json \
              -print

            exit 1
          fi

          echo "Required Amaal structure: PASS"

      - name: Validate package configuration
        shell: bash
        run: |
          set -euo pipefail

          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('.amaal-staging/package.json', 'utf8')
            );

            if (!p.name) {
              throw new Error('package.json is missing name');
            }

            if (!p.scripts) {
              throw new Error('package.json is missing scripts');
            }

            console.log('Package:', p.name);
            console.log('Package configuration: PASS');
          "

      - name: Show staged project
        shell: bash
        run: |
          set -euo pipefail

          echo "Staged project files:"

          find .amaal-staging \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      - name: Create repository backup
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating temporary backup of current application..."

          rm -rf .amaal-backup

          mkdir -p .amaal-backup

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".amaal-staging" \
            ! -name ".amaal-backup" \
            ! -name "${{ steps.zip.outputs.zip_name }}" \
            -exec cp -a {} .amaal-backup/ \;

          echo "Backup created."

      - name: Replace application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          echo "Removing previous application files."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".amaal-staging" \
            ! -name ".amaal-backup" \
            ! -name "$ZIP" \
            -exec rm -rf {} \;

          echo "Installing new Amaal application."

          cp -a .amaal-staging/. .

          echo "Application replacement completed."

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Running final verification..."

          test -f package.json
          test -d app
          test -d components
          test -d data
          test -d lib
          test -d types

          if [ -f app/package.json ]; then
            echo "::error::Unexpected nested app/package.json found."
            exit 1
          fi

          echo "Final application verification: PASS"

      - name: Remove ZIP and temporary files
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          rm -rf .amaal-staging
          rm -rf .amaal-backup

          rm -f "$ZIP"

          echo "Temporary files removed."

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Install/update Amaal Commerce application"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push

          echo "========================================"
          echo "AMAAL INSTALLATION SUCCESSFUL"
          echo "========================================"
