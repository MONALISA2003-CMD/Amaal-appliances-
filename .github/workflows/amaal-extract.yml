name: Amaal Commerce ZIP Extractor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amaal-zip-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and Install Amaal
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository root for ZIP files..."

          mapfile -t zips < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found:"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          ZIP="${zips[0]}"

          echo "ZIP selected: $ZIP"

          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          echo "Testing: $ZIP"

          unzip -t "$ZIP"

          echo "ZIP integrity check passed."

      - name: Extract ZIP to staging
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          rm -rf .amaal-staging

          mkdir -p .amaal-staging

          unzip -q "$ZIP" -d .amaal-staging

          echo "ZIP extracted successfully."

      - name: Normalize ZIP wrapper
        shell: bash
        run: |
          set -euo pipefail

          shopt -s dotglob nullglob

          entries=(.amaal-staging/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then

            wrapper="${entries[0]}"

            echo "Wrapper detected:"
            echo "$wrapper"

            mkdir -p .amaal-normalized

            cp -a "$wrapper"/. .amaal-normalized/

            rm -rf .amaal-staging

            mv .amaal-normalized .amaal-staging

          fi

          echo "ZIP normalization complete."

      - name: Protect repository workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing workflow files supplied inside ZIP."

          rm -rf .amaal-staging/.github

          echo "Repository .github directory will remain untouched."

      - name: Validate staged application
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".amaal-staging"

          echo "Validating application..."

          test -f "$ROOT/package.json"

          test -d "$ROOT/app"
          test -d "$ROOT/components"
          test -d "$ROOT/data"
          test -d "$ROOT/lib"
          test -d "$ROOT/types"

          if find "$ROOT" \
            -mindepth 2 \
            -name package.json \
            -print \
            | grep -q .; then

            echo "::error::Nested package.json detected."

            find "$ROOT" \
              -mindepth 2 \
              -name package.json \
              -print

            exit 1
          fi

          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('.amaal-staging/package.json', 'utf8')
            );

            if (!p.name) {
              throw new Error('package.json has no name');
            }

            if (!p.scripts) {
              throw new Error('package.json has no scripts');
            }

            console.log('Package:', p.name);
          "

          echo "Application validation passed."

      - name: Display staged structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Staged Amaal application:"

          find .amaal-staging \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      - name: Remove old application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          echo "Removing old application..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".amaal-staging" \
            ! -name "$ZIP" \
            -exec rm -rf {} \;

          echo "Old application removed."

      - name: Install new application
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing staged Amaal application..."

          cp -a .amaal-staging/. .

          echo "New application installed."

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -d app
          test -d components
          test -d data
          test -d lib
          test -d types

          test -d .github/workflows

          echo "Amaal application verified."

          echo
          echo "Workflow files currently installed:"
          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -print

      - name: Remove temporary files
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip_name }}"

          rm -rf .amaal-staging

          rm -f "$ZIP"

          echo "Temporary files removed."

      - name: Commit application
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git status --short

          git commit -m "Install Amaal Commerce application"

      - name: Push application
        shell: bash
        run: |
          set -euo pipefail

          git push

          echo
          echo "=========================================="
          echo " AMAAL COMMERCE INSTALLATION SUCCESSFUL "
          echo "=========================================="
